<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Admin – přihlášení" description="Přihlašovací obrazovka administrace." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:#080b12;font-family:var(--hd-font-sans);color:#080b12}a{color:#1769ff}a:hover{color:#080b12}@keyframes hdUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}</style></helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;box-sizing:border-box">
<span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1;color:#fff;animation:hdUp .7s cubic-bezier(.2,.7,.2,1) both"><strong style="font-size:20px;letter-spacing:-.02em">HOME</strong><span style="font-family:var(--hd-font-mono);font-size:10px;letter-spacing:.3em;color:#1769ff;font-weight:700">DETAILING</span></span>
<div style="width:100%;max-width:400px;animation:hdUp .8s cubic-bezier(.2,.7,.2,1) .1s both">
<x-import component-from-global-scope="HomeDetailingUI.Card" variant="panel" as="form" onSubmit="{{ submit }}" hint-size="100%,380px">
<div style="display:grid;gap:22px">
<x-import component-from-global-scope="HomeDetailingUI.Heading" size="panel" hint-size="100%,40px">Přihlášení</x-import>
<x-import component-from-global-scope="HomeDetailingUI.Field" label="E-mail" layout="stacked" hint-size="100%,80px"><x-import component-from-global-scope="HomeDetailingUI.Input" type="email" name="email" required="{{ true }}" auto-complete="username" hint-size="100%,52px"></x-import></x-import>
<x-import component-from-global-scope="HomeDetailingUI.Field" label="Heslo" layout="stacked" hint-size="100%,80px"><x-import component-from-global-scope="HomeDetailingUI.Input" type="password" name="password" required="{{ true }}" auto-complete="current-password" hint-size="100%,52px"></x-import></x-import>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="HomeDetailingUI.Notice" tone="error" hint-size="100%,48px">{{ error }}</x-import></sc-if>
<x-import component-from-global-scope="HomeDetailingUI.Button" type="submit" variant="primary" full-width="{{ true }}" hint-size="100%,52px">Přihlásit se</x-import>
</div>
</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { error: '' };
  renderVals() {
    return {
      hasError: !!this.state.error, error: this.state.error,
      submit: (e) => { e.preventDefault(); const f = new FormData(e.target); if (String(f.get('password')).length < 8) return this.setState({ error: 'Nesprávný e-mail nebo heslo.' }); this.setState({ error: '' }); if (this.props.onLogin) this.props.onLogin(); else location.href = '../admin/Admin.dc.html'; }
    };
  }
}
</script>
</body>
</html>
