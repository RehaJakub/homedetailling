name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homedetailing_test
          POSTGRES_USER: homedetailing
          POSTGRES_PASSWORD: homedetailing_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homedetailing -d homedetailing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://homedetailing:homedetailing_dev@127.0.0.1:5432/homedetailing_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: homedetailing/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrator is traced into the image
        run: docker run --rm homedetailing/app:ci node -e "import('drizzle-orm/node-postgres/migrator').then(() => console.log('migrator ok'))"
