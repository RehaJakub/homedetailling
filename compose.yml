# Local development stack. Only Postgres runs in Docker; the app runs with
# `make dev` on the host. The init script also creates `homedetailing_test`
# for the integration tests (first volume initialisation only; the Makefile's
# db-test-ensure target covers existing volumes).
name: homedetailing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homedetailing
      POSTGRES_USER: homedetailing
      POSTGRES_PASSWORD: homedetailing_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - homedetailing_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homedetailing -d homedetailing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homedetailing_postgres:
